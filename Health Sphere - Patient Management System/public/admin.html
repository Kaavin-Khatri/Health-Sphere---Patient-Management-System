<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Health Sphere</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shield-lock-fill me-2"></i>Health Sphere <span class="badge bg-white text-danger ms-2">Admin Panel</span></a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">Sign Out</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="fw-bold text-dark mb-4">Admin Overview</h2>
        
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab">All Users</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="doctors-tab" data-bs-toggle="tab" data-bs-target="#doctors" type="button" role="tab">Doctors</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="patients-tab" data-bs-toggle="tab" data-bs-target="#patients" type="button" role="tab">Patients</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            <!-- All Users Tab -->
            <div class="tab-pane fade show active" id="users" role="tabpanel">
                <div class="mb-3">
                    <input type="text" class="form-control" id="searchAllUsers" placeholder="Search All Users..." onkeyup="filterAdminTable('searchAllUsers', 'adminUsersTableBody')">
                </div>
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="bg-light text-muted">
                                    <tr>
                                        <th class="p-4 border-0">Name</th>
                                        <th class="p-4 border-0">Email</th>
                                        <th class="p-4 border-0">Role</th>
                                        <th class="p-4 border-0">Phone</th>
                                        <th class="p-4 border-0 text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="adminUsersTableBody">
                                    <!-- JS will populate this -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Doctors Tab -->
            <div class="tab-pane fade" id="doctors" role="tabpanel">
                <div class="mb-3">
                    <input type="text" class="form-control" id="searchDoctors" placeholder="Search Doctors..." onkeyup="filterAdminTable('searchDoctors', 'adminDoctorsTableBody')">
                </div>
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="bg-light text-muted">
                                    <tr>
                                        <th class="p-4 border-0">Name</th>
                                        <th class="p-4 border-0">Email</th>
                                        <th class="p-4 border-0">Role</th>
                                        <th class="p-4 border-0">Phone</th>
                                        <th class="p-4 border-0 text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="adminDoctorsTableBody">
                                    <!-- JS will populate this -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Patients Tab -->
            <div class="tab-pane fade" id="patients" role="tabpanel">
                <div class="mb-3">
                    <input type="text" class="form-control" id="searchPatients" placeholder="Search Patients..." onkeyup="filterAdminTable('searchPatients', 'adminPatientsTableBody')">
                </div>
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="bg-light text-muted">
                                    <tr>
                                        <th class="p-4 border-0">Name</th>
                                        <th class="p-4 border-0">Email</th>
                                        <th class="p-4 border-0">Role</th>
                                        <th class="p-4 border-0">Phone</th>
                                        <th class="p-4 border-0 text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="adminPatientsTableBody">
                                    <!-- JS will populate this -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="confirmationModalTitle">Confirm Action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p id="confirmationModalBody" class="text-muted mb-0">Are you sure you want to proceed?</p>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger rounded-pill" id="confirmationModalConfirmBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
